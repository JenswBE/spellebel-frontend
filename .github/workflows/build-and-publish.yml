name: Build and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: generate_website
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Minimal permissions to read source code
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Pull common linter configs
        run: wget -O .golangci.yml https://raw.githubusercontent.com/JenswBE/setup/main/programming_configs/golang/.golangci.yml

      - name: Lint service
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --disable err113,wrapcheck

      - name: Generate website
        run: go run . --prod --debug

      - name: Upload static files as artifact
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      id-token: write # to verify the deployment originates from an appropriate source
      pages: write    # to deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
